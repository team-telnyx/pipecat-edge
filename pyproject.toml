[project]
name = "function"
description = "A Pipecat phone agent on Telnyx Edge Compute"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[websocket,openai,runner]==1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["function"]
